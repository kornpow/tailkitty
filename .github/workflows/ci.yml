name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
      - run: uv sync --python ${{ matrix.python }} --all-groups --locked
      - run: mise run test

  wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
      - run: uv sync --all-groups --locked
      - run: uv run python -m scripts.build_wheels --target ${{ matrix.target }} --output dist
      - if: matrix.target == 'linux-x86_64'
        run: uv run python -m scripts.smoke_wheel dist/*-manylinux_2_17_x86_64.whl
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: uv sync --all-groups --locked
      - run: uv run python -m scripts.build_binary clean --output src/tailkitty/bin
      - run: uv build --sdist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
